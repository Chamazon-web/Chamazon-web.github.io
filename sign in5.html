<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamazon-Sign.in</title>
    <link rel="icon" type="image/png" href="logo1.jpg">
</head>
<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background-image: url(bg5.png);
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
    font-family: Arial, Helvetica, sans-serif;
}

.sign-in-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-y: auto;
    z-index: 9999;
}

.login-box {
    position: relative;
    width: 100%;
    max-width: 510px;
    background: #ffffff;
    border-radius: 12px;
    padding: 40px clamp(16px, 5vw, 32px) 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
    margin: auto;
}

.sign-in-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 32px;
    background: #ffffff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}
.sign-in-close p { margin: 0; color: #080808; }
.sign-in-close a {
    color: #fa0202;
    text-decoration: none;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

h2 {
    text-align: center;
    margin: 0 0 20px;
    font-size: clamp(22px, 5vw, 28px);
}

form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 16px; /* prevents iOS zoom on focus */
    border: 1px solid #bbb;
    border-radius: 10px;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 7px;
    background: #ffc400;
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
}
.submit-btn:hover {
    background: #ffb900;
    transform: translateY(-1px);
}

@media (max-width: 480px) {
    .sign-in-overlay { padding: 12px; }
    .login-box { border-radius: 10px; padding-top: 44px; }
    .submit-btn { font-size: 16px; }
}

@media (max-height: 520px) {
    .sign-in-overlay { align-items: flex-start; }
}
</style>
<body>
<div class="sign-in-overlay">
        
    <div class="login-box">
        <div class="sign-in-close"><p><a href="iphone.html">X</a></p></div>
        <h2>Sign-in</h2>

        <form>
            <input type="text" placeholder="Chamazon ID">

            <input type="password" placeholder="Password">

           <button class="submit-btn">
                Login
            </button>
        </form>
    </div>
</div>
</body>
</html>
