<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamazon Buy</title>
     <link rel="icon" type="image/png" href="logo1.jpg">
</head>
<style>
  body {
    margin: 0;
    background-color: #000000;
    font-family: Arial, sans-serif;
    color: white;
  }

  .upi-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }

  .upi-title {
    font-size: 32px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 25px;
  }

  .qr-box {
    width: 300px;
    height: 300px;
    background-color: #ffffff;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 25px rgba(0, 255, 170, 0.25);
    overflow: hidden;
  }

  .qr-placeholder {
    background-size: cover;
    color: #333333;
    font-size: 18px;
    font-weight: bold;
    padding: 15px;
  }

  .upi-subtitle {
    font-size: 16px;
    color: #cccccc;
    margin-top: 22px;
  }

  .upi-footer {
    background-color: #f7ca00;
    margin-top: 12px;
    width: 290px;
    height: 35px;
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
  }
  .upi-footer a{
    text-decoration: none;
    color: black;
  }

  .button{
    align-content: center;
    color: #000000;
    font-size: 22px;
    margin-top: 5px;
  }
  .check {
    margin-top: 22px;
    color: #cccccc;
    font-size: 20px;
  }
</style>
<body>
<div class="upi-container">
  <div class="upi-title">Pay via UPI</div>

  <div class="qr-box">
    <div class="qr-placeholder">
      <img src="Qr.png" alt="Qr.png" height="300px" width="">
    </div>
  </div>

  <div class="upi-subtitle">
    Scan the QR code to pay
  </div>

  <div class="upi-footer">
    <a href="order12.html"><div class="button">Proceed</div></a>
  </div>
  <div class="check">
    You can proceed after payment
</div>
</div>
</body>
</html>
